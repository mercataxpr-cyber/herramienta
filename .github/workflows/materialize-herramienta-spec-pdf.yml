name: Materialize Herramienta spec PDF

on:
  push:
    branches: [main]
    paths:
      - 'docs/.herramienta-pdf-parts/part08'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild PDF from temporary chunks
        shell: bash
        run: |
          set -euo pipefail
          cat docs/.herramienta-pdf-parts/part* > /tmp/herramienta_pdf.b64
          base64 -d /tmp/herramienta_pdf.b64 > docs/Herramienta_Especificaciones_y_Decisiones_v1.0.pdf
          test -s docs/Herramienta_Especificaciones_y_Decisiones_v1.0.pdf
          rm -rf docs/.herramienta-pdf-parts
          rm -f .github/workflows/materialize-herramienta-spec-pdf.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: materialize Herramienta specifications PDF v1.0'
          git push
